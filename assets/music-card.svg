<svg xmlns="http://www.w3.org/2000/svg" width="840" height="300" viewBox="0 0 840 300" role="img" aria-labelledby="title description">
  <title id="title">Static music card</title>
  <desc id="description">An editable static song card with a manually updated time-remaining display.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1726"/>
      <stop offset="1" stop-color="#102d3a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d9ff"/>
      <stop offset="1" stop-color="#39c5bb"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="838" height="298" rx="24" fill="url(#background)" stroke="#234352" stroke-width="2"/>
  <rect x="28" y="28" width="244" height="244" rx="18" fill="#102331"/>
  <circle cx="150" cy="150" r="82" fill="#07111f" stroke="#39c5bb" stroke-width="2"/>
  <circle cx="150" cy="150" r="12" fill="#00d9ff"/>
  <path d="M140 116v55a20 20 0 1 1-10-17v-53l62-13v67a20 20 0 1 1-10-17v-63z" fill="url(#accent)" transform="translate(8 0) scale(.82) translate(32 32)"/>
  <text x="310" y="68" fill="#39c5bb" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="3">STATIC NOW PLAYING</text>
  <text x="310" y="125" fill="#f0fbff" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="700">Your song title</text>
  <text x="310" y="163" fill="#a8c2cc" font-family="Segoe UI,Arial,sans-serif" font-size="21">Artist name</text>
  <text x="310" y="216" fill="#8aa5af" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2">TIME LEFT</text>
  <text x="310" y="257" fill="#00d9ff" font-family="Consolas,monospace" font-size="34" font-weight="700">02:48</text>
  <text x="482" y="255" fill="#8aa5af" font-family="Segoe UI,Arial,sans-serif" font-size="14">remaining</text>
  <rect x="610" y="214" width="190" height="8" rx="4" fill="#29434c"/>
  <rect x="610" y="214" width="78" height="8" rx="4" fill="url(#accent)"/>
  <text x="610" y="247" fill="#8aa5af" font-family="Segoe UI,Arial,sans-serif" font-size="12">STATIC COUNTDOWN</text>
</svg>
